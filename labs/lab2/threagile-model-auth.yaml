threagile_version: 1.0.0

title: Juice Login Model
date: 2026-09-14

author:
  name: Vi
  homepage: https://github.com/ViAlexiV

management_summary_comment: >
  Feature-level threat model for the OWASP Juice Shop login and admin access path.

business_criticality: important

business_overview:
  description: >
    This model focuses only on authentication: browser login, credential validation,
    JWT issuing and verification, credential storage, JWT signing key storage, and
    an admin endpoint protected by token-based authorization.
  images: []

technical_overview:
  description: >
    A user browser submits credentials to the login endpoint. The login endpoint
    validates credentials against the credential store and calls a token service
    to issue a JWT. The token service uses a JWT signing key stored separately.
    The browser then calls the admin endpoint with the JWT; the admin endpoint
    verifies the token and enforces an authorization check before returning admin data.
  images: []

questions: {}

abuse_cases:
  Credential stuffing: >
    Attackers try reused credentials against the login endpoint.
  Token forgery: >
    Attackers try to forge or tamper with JWTs to access admin functionality.
  Admin privilege abuse: >
    Attackers attempt to access admin data without the required authorization.

security_requirements:
  Admin authorization check: >
    The admin endpoint must require a valid JWT and enforce the user's admin role
    before returning admin data.
  JWT signing key protection: >
    The JWT signing key must be stored separately and encrypted at rest.
  Credential protection: >
    Credentials must be transmitted over HTTPS and verified against protected hashes.

tags_available:
  - auth
  - jwt
  - admin
  - credentials
  - secrets
  - pii
  - browser
  - app
  - datastore

data_assets:
  User Credentials:
    id: user-credentials
    description: "Usernames, emails, passwords, and password hashes used for login."
    usage: business
    tags: ["auth", "credentials", "pii"]
    origin: user-supplied
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Credentials are sensitive and must not be disclosed or modified."

  Session JWT:
    id: session-jwt
    description: "JWT issued after successful authentication."
    usage: business
    tags: ["auth", "jwt"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "A forged or stolen JWT can grant access to protected routes."

  JWT Signing Key:
    id: jwt-signing-key
    description: "Secret key used to sign and verify JWTs."
    usage: business
    tags: ["secrets", "jwt"]
    origin: application
    owner: Lab Owner
    quantity: few
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Compromise of the signing key allows token forgery."

  Admin Data:
    id: admin-data
    description: "Data returned by protected admin endpoints."
    usage: business
    tags: ["admin", "pii"]
    origin: application
    owner: Lab Owner
    quantity: many
    confidentiality: confidential
    integrity: important
    availability: important
    justification_cia_rating: "Admin data should only be visible to authorized administrators."

technical_assets:
  User Browser:
    id: user-browser
    description: "End-user browser submitting login requests and later calling admin endpoints."
    type: external-entity
    usage: business
    used_as_client_by_human: true
    out_of_scope: false
    justification_out_of_scope:
    size: system
    technology: browser
    tags: ["browser"]
    internet: true
    machine: virtual
    encryption: none
    owner: External User
    confidentiality: public
    integrity: operational
    availability: operational
    justification_cia_rating: "Client is controlled by the user and may be attacker-controlled."
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Submit Login:
        target: login-endpoint
        description: "Browser submits credentials to the login endpoint over HTTPS."
        protocol: https
        authentication: credentials
        authorization: enduser-identity-propagation
        tags: ["auth"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - user-credentials
        data_assets_received:
          - session-jwt
      Call Admin:
        target: admin-endpoint
        description: "Browser calls the admin endpoint with a JWT; this is the admin authorization check."
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["admin", "auth"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - session-jwt
        data_assets_received:
          - admin-data

  Login Endpoint:
    id: login-endpoint
    description: "Application endpoint that accepts credentials and starts the login flow."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-server
    tags: ["app", "auth"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: internal
    integrity: important
    availability: important
    justification_cia_rating: "Login endpoint handles credentials and token issuance."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - user-credentials
      - session-jwt
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Validate Credentials:
        target: credential-store
        description: "Validate submitted credentials against stored password hashes."
        protocol: sql-access-protocol-encrypted
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["auth"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
          - user-credentials
        data_assets_received:
          - user-credentials
      Issue Token:
        target: token-service
        description: "Ask token service to issue a signed JWT."
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["jwt"]
        vpn: false
        ip_filtered: false
        readonly: false
        usage: business
        data_assets_sent:
          - user-credentials
        data_assets_received:
          - session-jwt

  Token Service:
    id: token-service
    description: "Service that signs and verifies JWTs."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-server
    tags: ["jwt", "auth"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: internal
    integrity: critical
    availability: important
    justification_cia_rating: "Token service protects session integrity."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - session-jwt
      - jwt-signing-key
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Read Signing Key:
        target: jwt-key-store
        description: "Read JWT signing key from protected key store."
        protocol: local-file-access
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["secrets", "jwt"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent: []
        data_assets_received:
          - jwt-signing-key

  Admin Endpoint:
    id: admin-endpoint
    description: "Protected endpoint requiring a valid JWT and admin role authorization."
    type: process
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: web-server
    tags: ["admin", "app"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: internal
    integrity: important
    availability: important
    justification_cia_rating: "Admin endpoint exposes privileged data."
    multi_tenant: false
    redundant: false
    custom_developed_parts: true
    data_assets_processed:
      - session-jwt
      - admin-data
    data_assets_stored: []
    data_formats_accepted:
      - json
    communication_links:
      Verify JWT:
        target: token-service
        description: "Verify JWT signature and claims before serving admin data."
        protocol: https
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["jwt", "admin"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
          - session-jwt
        data_assets_received:
          - session-jwt
      Read Admin Data:
        target: credential-store
        description: "Read admin-only data after authorization succeeds."
        protocol: sql-access-protocol-encrypted
        authentication: token
        authorization: enduser-identity-propagation
        tags: ["admin"]
        vpn: false
        ip_filtered: false
        readonly: true
        usage: business
        data_assets_sent:
          - session-jwt
        data_assets_received:
          - admin-data

  Credential Store:
    id: credential-store
    description: "Database holding user credential hashes and admin data."
    type: datastore
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: database
    tags: ["datastore", "credentials"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Credential store contains sensitive auth and admin data."
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored:
      - user-credentials
      - admin-data
    data_formats_accepted:
      - json
    communication_links: {}

  JWT Key Store:
    id: jwt-key-store
    description: "Protected store for the JWT signing key."
    type: datastore
    usage: business
    used_as_client_by_human: false
    out_of_scope: false
    justification_out_of_scope:
    size: component
    technology: file-server
    tags: ["secrets", "jwt"]
    internet: false
    machine: container
    encryption: data-with-symmetric-shared-key
    owner: Lab Owner
    confidentiality: strictly-confidential
    integrity: critical
    availability: important
    justification_cia_rating: "Key store protects the JWT signing key."
    multi_tenant: false
    redundant: false
    custom_developed_parts: false
    data_assets_processed: []
    data_assets_stored:
      - jwt-signing-key
    data_formats_accepted:
      - file
    communication_links: {}

